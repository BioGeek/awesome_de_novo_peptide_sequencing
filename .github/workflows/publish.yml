name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The render now takes ~9 minutes because it builds ~2446 entity pages, so two
# publishes can genuinely overlap: all four refresh workflows dispatch this one,
# and `quarto publish gh-pages` force-pushes the branch. Without this, the
# second push wins and the first job goes red for no real reason.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --frozen

      # Pinned deliberately. Every rendered page embeds
      # <meta name="generator" content="quarto-x.y.z"> and links the theme CSS
      # by a CONTENT-HASHED filename, so a Quarto upgrade rewrites a byte in all
      # ~2446 pages at once and gh-pages gains ~45 MB of blobs in one commit.
      # Pinning makes that an intentional, occasional event.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # Writes pages/{publications,authors,algorithms,institutions,venues}/.
      # A separate step rather than a Quarto pre-render hook: the hook works
      # (Quarto recomputes the render list afterwards), but keeping it explicit
      # means a failure here stops the build instead of silently publishing a
      # stale or empty page set.
      - name: Generate entity pages
        run: uv run python build_pages.py

      # Render and publish are SEPARATE steps, and postrender.py runs between
      # them rather than as a Quarto `post-render` hook.
      #
      # Quarto hands a post-render script the full list of output files in the
      # QUARTO_PROJECT_OUTPUT_FILES environment variable, and Linux caps any
      # single argv/env string at MAX_ARG_STRLEN, 128 KiB. At 2446 pages that
      # list is 130,993 bytes with local paths -- 79 bytes under the limit --
      # and CI paths are ~45 characters longer per file, so the hook died with
      # "Failed to spawn '/usr/bin/python3': Argument list too long". It would
      # have broken locally too within a couple of pages.
      #
      # Splitting them also matches the reasoning above for build_pages.py: an
      # explicit step fails the build loudly instead of failing inside a hook.
      - name: Render
        run: uv run quarto render
        env:
          QUARTO_PYTHON: .venv/bin/python

      - name: Fix the home page's sitemap entry
        run: python3 postrender.py

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: .venv/bin/python
