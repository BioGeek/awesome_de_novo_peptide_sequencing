name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_render:
        description: "Re-render every page, ignoring the incremental check"
        type: boolean
        default: false

permissions:
  contents: write

# The render now takes ~9 minutes because it builds ~6387 entity pages, so two
# publishes can genuinely overlap: all four refresh workflows dispatch this one,
# and `quarto publish gh-pages` force-pushes the branch. Without this, the
# second push wins and the first job goes red for no real reason.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # A full render costs about 0.4 s per generated page. At 6282 pages that
    # is ~42 minutes, and the old 30-minute cap cancelled run 37236776725 at
    # page 4370. 90 leaves room for the catalog to keep growing; a partial or
    # index render still finishes in a few minutes.
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --frozen

      # Pinned deliberately. Every rendered page embeds
      # <meta name="generator" content="quarto-x.y.z"> and links the theme CSS
      # by a CONTENT-HASHED filename, so a Quarto upgrade rewrites a byte in all
      # ~6387 pages at once and gh-pages gains ~45 MB of blobs in one commit.
      # Pinning makes that an intentional, occasional event.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # Render and publish are SEPARATE steps, and postrender.py runs between
      # them rather than as a Quarto `post-render` hook.
      #
      # Quarto hands a post-render script the full list of output files in the
      # QUARTO_PROJECT_OUTPUT_FILES environment variable, and Linux caps any
      # single argv/env string at MAX_ARG_STRLEN, 128 KiB. At 2446 pages that
      # list is 130,993 bytes with local paths -- 79 bytes under the limit --
      # and CI paths are ~45 characters longer per file, so the hook died with
      # "Failed to spawn '/usr/bin/python3': Argument list too long". It would
      # have broken locally too within a couple of pages.
      #
      # Splitting them also matches the reasoning above for build_pages.py: an
      # explicit step fails the build loudly instead of failing inside a hook.
      # Restore the previous build. gh-pages IS the last published _site, so it
      # is a free and always-exact cache, and it makes _site complete before
      # anything is rendered into it. That matters for the fast path below,
      # which renders index.qmd alone: publishing a _site holding only
      # index.html would be catastrophic if `quarto publish gh-pages` mirrors
      # rather than merges. Restoring first means the answer never matters.
      - name: Restore the previous site from gh-pages
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            mkdir -p _site
            git archive FETCH_HEAD | tar -x -C _site
            echo "restored $(find _site -name '*.html' | wc -l) html files"
          else
            echo "no gh-pages branch yet; a full render will follow"
          fi

      - name: Generate entity pages
        run: uv run python build_pages.py

      # A full render is ~17 minutes and ~98.7% of this job. Almost every push
      # does not need it: build_pages.py keeps volatile metrics out of the
      # pages, so the DAILY refresh-repo-metrics commit changes zero of them,
      # and a commit that changes a handful -- a new paper, or the weekly
      # benchmark refresh touching the 17 method pages that carry a benchmark
      # line -- gets those pages rendered and nothing else.
      - name: Decide render scope
        id: scope
        env:
          FULL_RENDER: ${{ inputs.full_render }}
        run: python3 render_scope.py

      - name: Render everything
        if: steps.scope.outputs.mode == 'full'
        run: uv run quarto render
        env:
          QUARTO_PYTHON: .venv/bin/python

      # One `quarto render` per file, because `quarto render a.qmd b.qmd`
      # silently renders only the first input. render_scope.py caps the list at
      # 60 files and asks for a full render past that.
      - name: Render index.qmd and the changed pages
        if: steps.scope.outputs.mode == 'partial'
        run: |
          uv run quarto render index.qmd
          while read -r page; do
            [ -n "$page" ] || continue
            echo "::group::$page"
            uv run quarto render "$page"
            echo "::endgroup::"
          done < _site/.render-files
        env:
          QUARTO_PYTHON: .venv/bin/python

      # index.qmd is rendered on EVERY run regardless: its footer carries the
      # build date and its charts read the database at render time, so its
      # output changes even when no page does.
      - name: Render index.qmd only
        if: steps.scope.outputs.mode == 'index'
        run: uv run quarto render index.qmd
        env:
          QUARTO_PYTHON: .venv/bin/python

      - name: Record what _site now contains
        run: python3 render_scope.py --record

      - name: Fix the home page's sitemap entry
        run: python3 postrender.py

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: .venv/bin/python
