# Mine the DNPS-DR daily report for papers the catalog is missing.
#
# https://huggingface.co/spaces/yangtingpeng/DNPS-DR is a Hugging Face Space
# posting a daily de novo peptide sequencing literature briefing; it is itself
# publication 272. scripts/build_dnps_candidates.py reads its data/summaries.json and
# reports which of those papers are not in the catalog.
#
# Same shape and same rules as refresh-candidates.yml, for the same reasons:
# it commits NOTHING, needs only read permission, touches denovo.db not at
# all, and must never use .github/actions/commit-refreshed-db, which recovers
# from a push race by replaying the one table a workflow owns -- this one owns
# none. dnps_candidates.csv is gitignored like the other builder CSVs, so the
# shortlist goes into the job summary and the full file is an artifact.
#
# A job summary is only read by someone who goes looking, so when the run
# finds a paper nobody has ruled on yet it also opens an issue assigned to the
# repository owner, which is what sends the notification. The builder already
# drops everything decided (catalog, WATCHLIST.md, screening_decisions.tsv),
# so a quiet month opens nothing, and while an issue is
# open a later run only comments with candidates the issue does not yet name.
#
# It adds nothing to the database on purpose. Two senses of "de novo" run
# through that feed -- sequencing and DESIGN -- and telling them apart is most
# of what the script does, but the final call against the WATCHLIST.md bar is a
# judgement a human makes.
#
# Monthly on the 3rd at 09:00 UTC: the day after refresh-candidates on the 2nd,
# so the two never race for main, and three hours after the daily
# refresh-repo-metrics. Monthly rather than daily because the Space's scheduler
# writes inside its running container: new days reach the git repo only when the
# author commits, and the builder exits early on an unchanged lastModified, so a
# quiet month costs one API call.
name: refresh-dnps-candidates

on:
  schedule:
    - cron: '0 9 3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the Space has not changed'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-dnps-candidates
  cancel-in-progress: false

jobs:
  refresh-dnps-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # rapidfuzz is the one non-stdlib import, for title matching against the
      # catalog, so unlike scripts/build_candidates.py this needs the environment.
      - name: Sync Python environment
        run: uv sync --frozen

      - name: Harvest candidates from the DNPS-DR feed
        run: |
          uv run python scripts/build_dnps_candidates.py \
            ${{ inputs.force && '--force' || '' }} \
            --summary dnps_summary.md

      - name: Write the shortlist into the job summary
        if: always()
        run: |
          if [ -s dnps_summary.md ]; then
            cat dnps_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## DNPS-DR candidates" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The Space was unchanged, so nothing was rebuilt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the full list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnps-candidates
          path: dnps_candidates.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update an issue for new candidates
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import csv, json, os, subprocess
          from pathlib import Path
          from urllib.parse import quote

          p = Path("dnps_candidates.csv")
          rows = list(csv.DictReader(p.open(encoding="utf-8"))) if p.exists() else []
          if not rows:
              print("No undecided candidates; no issue.")
              raise SystemExit(0)

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          TITLE = "DNPS-DR feed: papers to screen"
          key = lambda r: r["doi"] or r["link"]
          line = lambda r: (f"- [ ] {r['feed_date']} **{r['title']}** "
                            f"({r['journal'] or 'venue unknown'} {r['year']}) "
                            # Links, so each paper is one click from its record:
                            # the DOI, else the feed's PubMed link, else a search.
                            + (f"[{r['doi']}](https://doi.org/{r['doi']})" if r['doi']
                               else f"[PubMed]({r['link']})" if r['link']
                               else "[search Europe PMC](https://europepmc.org/search?query="
                                    + quote('TITLE:"' + r["title"].replace('"', "") + '"', safe="") + ")"))
          footer = ("\n\nDecide each against the bar in WATCHLIST.md: catalogue it, or record "
                    "the rejection in WATCHLIST.md or `screening_decisions.tsv`, "
                    "so the next run stops proposing it. "
                    f"Full list: [run artifact]({os.environ['RUN_URL']}).")

          found = json.loads(gh("issue", "list", "--state", "open", "--search", f"{TITLE} in:title",
                                "--json", "number,title,body"))
          found = [i for i in found if i["title"] == TITLE]
          if found:
              num = str(found[0]["number"])
              seen = found[0]["body"] + "".join(
                  c["body"] for c in json.loads(gh("issue", "view", num, "--json", "comments"))["comments"])
              fresh = [r for r in rows if key(r) not in seen]
              if not fresh:
                  print(f"All {len(rows)} candidates are already listed on #{num}.")
                  raise SystemExit(0)
              body = (f"@{os.environ['OWNER']} {len(fresh)} more from this run:\n\n"
                      + "\n".join(map(line, fresh)) + footer)
              gh("issue", "comment", num, "--body", body)
              print(f"Commented {len(fresh)} new candidates on #{num}.")
          else:
              body = (f"The DNPS-DR feed turned up {len(rows)} paper(s) that are not in the "
                      "catalog and have not been ruled on:\n\n" + "\n".join(map(line, rows)) + footer)
              print(gh("issue", "create", "--title", TITLE, "--body", body,
                       "--assignee", os.environ["OWNER"]))
          PY
