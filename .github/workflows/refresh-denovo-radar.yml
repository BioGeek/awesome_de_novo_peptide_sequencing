# Harvest recent de novo peptide sequencing papers and publish them to the
# Hugging Face Space BioGeek/denovo-radar.
#
# WHY THE HARVEST IS HERE AND NOT IN THE SPACE. A Space that schedules its own
# work writes into container storage: the results never reach its git repo and
# do not survive a restart. The feed that inspired the Space does exactly that,
# and its published data stopped moving while the Space kept running. Running
# the harvest here means every result is a commit with a date on it.
#
# It commits NOTHING to this repository -- the data belongs to the Space -- so
# it needs only read permission on contents here, and it must never use
# .github/actions/commit-refreshed-db, which recovers from a push race by
# replaying the one table a workflow owns. This one owns none.
#
# It does write ISSUES. A paper the harvest keeps that is neither catalogued
# nor rejected (WATCHLIST.md, screening_decisions.tsv) opens an issue assigned
# to the repository owner, which is what sends a notification; the Space and
# the job summary are only read by someone already looking. While that issue
# is open, a later run comments with just the papers it does not yet name. The
# same step lives in refresh-dnps-candidates.yml, with its own issue title.
#
# Needs two secrets, neither of which this repo can create for you:
#   HF_TOKEN            a Hugging Face token with WRITE access to BioGeek
#   OPENALEX_API_KEY    optional; Europe PMC alone works without it, but the
#                       OpenAlex half is rate-limited to the shared free budget
# Add them with:  gh secret set HF_TOKEN
name: refresh-denovo-radar

on:
  schedule:
    # Weekly, Monday 10:00 UTC. One hour after refresh-benchmarks so the two
    # never overlap, and weekly rather than daily because this is a literature
    # feed: a day's worth of new de novo sequencing papers is usually zero.
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest publication date, YYYY-MM-DD, or a number of days back (default: 400)'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-denovo-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the catalog (for denovo.db)
        uses: actions/checkout@v4

      - name: Check out the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set; add it with 'gh secret set HF_TOKEN'"
            exit 1
          fi
          git clone --depth 1 \
            "https://hf_user:${HF_TOKEN}@huggingface.co/spaces/BioGeek/denovo-radar" space

      - name: Harvest
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          cd space
          # Both files, because the self-cleaning works in both directions:
          # --catalog marks what has been added, --watchlist drops what has been
          # rejected so the Space stops re-proposing it.
          python3 harvest.py --catalog ../denovo.db --watchlist ../WATCHLIST.md \
            --decisions ../screening_decisions.tsv \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            | tee ../harvest.out

      # Only commit when the paper list actually changed. `generated` carries
      # today's date and would otherwise produce a commit every single week
      # saying nothing, which is the churn the other refresh workflows avoid.
      - name: Publish to the Space when the papers changed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd space
          if git diff --quiet -- data/papers.json; then
            echo "No change to data/papers.json."; exit 0
          fi
          # The step runs under bash -e, so the check's deliberate exit 7 has to
          # be caught on the same line: a bare `rc=$?` after it never runs, and
          # a week where only the date moved failed the whole workflow.
          rc=0
          python3 - <<'PY' || rc=$?
          import json, pathlib, subprocess
          old = json.loads(subprocess.run(
              ["git", "show", "HEAD:data/papers.json"],
              capture_output=True, text=True).stdout or "{}")
          new = json.loads(pathlib.Path("data/papers.json").read_text())
          def key(b): return {(p.get("doi") or p.get("title")) for p in b.get("papers", [])}
          if key(old) == key(new):
              print("Only the generated date moved; not committing.")
              raise SystemExit(7)
          added = key(new) - key(old)
          pathlib.Path("../added.txt").write_text("\n".join(sorted(map(str, added))))
          print(f"{len(added)} paper(s) new since the last run")
          PY
          if [ $rc -eq 7 ]; then exit 0; fi
          if [ $rc -ne 0 ]; then exit $rc; fi
          git -c user.name="denovo-radar bot" \
              -c user.email="j.vangoey@instadeep.com" \
              commit -q -am "Refresh the paper list" 
          git push "https://hf_user:${HF_TOKEN}@huggingface.co/spaces/BioGeek/denovo-radar" HEAD:main

      - name: Open or update an issue for papers to screen
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          # The harvest has already dropped everything recorded as rejected;
          # what is left and not in_catalog is a paper nobody has ruled on.
          data = json.loads(Path("space/data/papers.json").read_text(encoding="utf-8"))
          rows = [p for p in data.get("papers", []) if not p.get("in_catalog")]
          if not rows:
              print("Every kept paper is catalogued; no issue.")
              raise SystemExit(0)

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          TITLE = "denovo-radar: papers to screen"
          def ref(p):
              if p.get("doi"):
                  return f"`{p['doi']}`"
              if p.get("pmid"):
                  return f"https://pubmed.ncbi.nlm.nih.gov/{p['pmid']}/"
              return ""
          line = lambda p: (f"- [ ] {p.get('date', '')} **{p.get('title', '').strip()}** "
                            f"({p.get('journal') or 'venue unknown'}) {ref(p)}")
          footer = ("\n\nDecide each against the bar in WATCHLIST.md: catalogue it, or record "
                    "the rejection in WATCHLIST.md or `screening_decisions.tsv`, so the next "
                    "harvest stops proposing it. "
                    f"Run: {os.environ['RUN_URL']} · Space: https://huggingface.co/spaces/BioGeek/denovo-radar")

          found = json.loads(gh("issue", "list", "--state", "open", "--search", f"{TITLE} in:title",
                                "--json", "number,title,body"))
          found = [i for i in found if i["title"] == TITLE]
          if found:
              num = str(found[0]["number"])
              seen = found[0]["body"] + "".join(
                  c["body"] for c in json.loads(gh("issue", "view", num, "--json", "comments"))["comments"])
              # Match on the reference as printed, so a bare PMID cannot hit
              # some other number already in the thread.
              fresh = [p for p in rows if (ref(p) or p.get("title", "")) not in seen]
              if not fresh:
                  print(f"All {len(rows)} papers are already listed on #{num}.")
                  raise SystemExit(0)
              body = (f"@{os.environ['OWNER']} {len(fresh)} more from this run:\n\n"
                      + "\n".join(map(line, fresh)) + footer)
              gh("issue", "comment", num, "--body", body)
              print(f"Commented {len(fresh)} new papers on #{num}.")
          else:
              body = (f"The denovo-radar harvest kept {len(rows)} paper(s) that are not in the "
                      "catalog and have not been ruled on:\n\n" + "\n".join(map(line, rows)) + footer)
              print(gh("issue", "create", "--title", TITLE, "--body", body,
                       "--assignee", os.environ["OWNER"]))
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## De Novo Peptide Sequencing Radar"
            echo
            sed 's/^/    /' harvest.out 2>/dev/null || echo "Harvest produced no output."
            echo
            if [ -s added.txt ]; then
              echo "### New since the last run"
              sed 's/^/- /' added.txt
            fi
            echo
            echo "Space: https://huggingface.co/spaces/BioGeek/denovo-radar"
          } >> "$GITHUB_STEP_SUMMARY"
