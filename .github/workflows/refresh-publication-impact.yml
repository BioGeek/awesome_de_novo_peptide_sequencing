name: Refresh publication impact

on:
  schedule:
    # Weekly on Sunday at 06:30 UTC, 30 minutes after the daily repo-metrics
    # workflow would have finished, so on Sundays the two don't race for the
    # main branch. OpenAlex cited_by_count drifts incrementally as papers get
    # cited; weekly captures meaningful change without spamming commits.
    - cron: '30 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions:  write   # trigger publish.yml after a successful commit

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --frozen

      - name: Refresh publication citation impact
        run: |
          uv run python build_publication_impact.py
          sqlite3 denovo.db .dump > denovo.sql

      - name: Commit if cited_by_count changed
        id: commit
        uses: ./.github/actions/commit-refreshed-db
        with:
          table: publication_impact
          message: Weekly refresh of OpenAlex publication citation counts
          workflow-file: refresh-publication-impact.yml
          no-changes-message: No citation-count drift this week, nothing to commit.

      - name: Trigger site rebuild
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main
