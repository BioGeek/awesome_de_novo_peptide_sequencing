# Look for papers that belong in the catalog but are not in it, by asking
# OpenAlex what our publications cite and what cites them.
#
# NOT one of the four refresh-* workflows despite the name shape, and it must
# never use .github/actions/commit-refreshed-db. That action recovers from a
# push race by hard-resetting to origin/main and replaying the one table it
# exclusively owns. This job owns no table and touches denovo.db not at all.
#
# It commits nothing, which is why it needs only read permission. candidates.csv
# is gitignored, like the other builder audit CSVs (citation_audit.csv,
# version_audit.csv, author_id_audit.csv), so the results are surfaced where
# they can be read without downloading anything: the top of the list goes into
# the job summary, and the full file is attached as an artifact.
#
# It also deliberately adds nothing to the database. Whether a paper belongs is
# a judgement call against the bar in WATCHLIST.md (for a review, de novo must
# be the subject; for an application, de novo must have produced part of the
# result), and a citation count cannot make it.
#
# Monthly on the 2nd at 09:00 UTC: a day after refresh-citation-graph rebuilds
# publication_citation on the 1st, and three hours after the daily
# refresh-repo-metrics, so it never races either for main.
name: refresh-candidates

on:
  schedule:
    - cron: '0 9 2 * *'
  workflow_dispatch:
    inputs:
      min_links:
        description: 'Minimum number of catalog papers linking a candidate'
        required: false
        default: '3'
      direction:
        description: 'both | references | citations'
        required: false
        default: 'both'

permissions:
  contents: read

concurrency:
  group: refresh-candidates
  cancel-in-progress: false

jobs:
  refresh-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build_candidates.py is stdlib-only: no uv sync, no lockfile, no deps.
      - name: Harvest candidates from OpenAlex
        run: |
          python3 build_candidates.py \
            --direction "${{ github.event.inputs.direction || 'both' }}" \
            --min-links "${{ github.event.inputs.min_links || '3' }}" \
            --out candidates.csv

      - name: Write the shortlist into the job summary
        if: always()
        run: |
          {
            echo "## Candidate papers not in the catalog"
            echo
            if [ ! -s candidates.csv ]; then
              echo "No candidates file produced."
              exit 0
            fi
            echo "Scored by how many catalog papers link each work. Expect"
            echo "database-search baselines (SEQUEST, Mascot, MaxQuant) near the"
            echo "top: every de novo paper cites one. Apply the WATCHLIST.md bar."
            echo
            echo "| Links | Cited by us | Cites us | Year | Title | Venue | DOI |"
            echo "|------:|------------:|---------:|-----:|-------|-------|-----|"
            python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("candidates.csv")))
          for r in rows[:40]:
              title = r["title"][:90].replace("|", "\\|")
              venue = r["venue"][:40].replace("|", "\\|")
              doi = f"[{r['doi']}]({r['url']})" if r["doi"] else ""
              print(f"| {r['links_total']} | {r['cited_by_our_papers']} | "
                    f"{r['cites_our_papers']} | {r['year']} | {title} | {venue} | {doi} |")
          print()
          print(f"{len(rows)} candidates in total; the full list is attached as an artifact.")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates.csv
          if-no-files-found: warn
          retention-days: 90
