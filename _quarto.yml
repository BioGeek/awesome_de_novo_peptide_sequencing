project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - pages/

website:
  title: "Awesome *De Novo* Peptide Sequencing"
  description: "A comprehensive, interactive map of the *de novo* peptide sequencing field: algorithms, post-processors, downstream applications, and adjacent tools, deep-learning and classical alike."
  site-url: https://jeroen.vangoey.be/awesome_de_novo_peptide_sequencing/
  repo-url: https://github.com/BioGeek/awesome_de_novo_peptide_sequencing
  repo-actions: [edit, issue]
  page-navigation: false
  back-to-top-navigation: true
  # Without a navbar the ~7470 generated entity pages have no way back to the
  # map except the in-page links the generator writes. A sidebar is not an
  # option at that scale.
  navbar:
    title: "Awesome *De Novo* Peptide Sequencing"
    left:
      - text: "The map"
        href: index.html
      # #every-paper, not #browse-all-papers: the section opens with the short
      # 'Recently added' list, so the heading anchor landed a reader on recent
      # arrivals rather than on the table this link promises.
      # #every-paper, not #browse-all-papers: the section opens with the short
      # 'Recently added' list, so the heading anchor landed a reader on recent
      # arrivals rather than on the table this link promises.
      - text: "Papers"
        href: index.html#every-paper
      # Methods points at the architectures swim lane, the only view that shows
      # every method, the same target the hero's 'methods' badge uses.
      - text: "Methods"
        href: index.html#the-architectures
      # Datasets points at the SECTION, not at its table, unlike Papers above:
      # that section opens with the charts a reader wants, where the papers
      # section opened with a short list of recent arrivals standing in the way.
      - text: "Datasets"
        href: index.html#the-data-underneath
      - text: "Authors"
        href: index.html#browse-all-authors
    right:
      - icon: github
        href: https://github.com/BioGeek/awesome_de_novo_peptide_sequencing
        aria-label: "Source on GitHub"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-tools: false
    fig-responsive: true
    grid:
      body-width: 1100px
    include-in-header:
      - text: |
          <!-- The page description meta tag is deliberately NOT hardcoded
               here. Quarto emits one per page from the front-matter
               description field, and every generated entity page now sets its
               own, so a hardcoded copy in this include produced two of them on
               every generated page. index.qmd carries its own description
               instead. (No count here on purpose: the page total moves with
               the data, and nothing checks a number buried in an HTML
               comment.) -->
          <meta property="og:title" content="Awesome De Novo Peptide Sequencing">
          <meta property="og:description" content="Comprehensive interactive map of the de novo peptide sequencing field: algorithms, post-processors, downstream applications, and adjacent tools (DL and classical).">
